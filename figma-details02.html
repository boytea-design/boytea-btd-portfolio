
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FIGMA 02 Project | BOY TEA</title>

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">

  
<style>
/* =========================================
   VIDEO DETAILS — FINAL
========================================= */

:root {
  --detail-width: 1144px;
}

/* 전체 페이지 */
html {
  min-height: 100%;
  background: #f2f2f2;
}

body.detail-page {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;

  font-family: "SUIT Variable", "SUIT", Arial, sans-serif;
  color: #111;

  background-color: #f2f2f2;
  background-image:
    linear-gradient(
      rgba(255,255,255,.55),
      rgba(255,255,255,.55)
    ),
    url("assets/img/concrete_texture.png");

  background-size: auto, 960px auto;
  background-position: center top;
  background-repeat: no-repeat, repeat;
}

/* 공통 정렬 기준 */
body.detail-page .detail-container,
body.detail-page .detail-header-inner {
  width: min(
    var(--detail-width),
    calc(100% - 40px)
  );
  max-width: none;
  margin-left: auto;
  margin-right: auto;
}

/* =========================================
   HEADER
========================================= */

body.detail-page .detail-header {
  position: relative;
  width: 100%;
  background: transparent;
  border-bottom: none;
  box-shadow: none;
}

body.detail-page .detail-header::before,
body.detail-page .detail-header::after {
  content: none;
}

body.detail-page .detail-header-inner {
  min-height: 82px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

body.detail-page .detail-logo {
  color: #000;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

body.detail-page .detail-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 34px;
  margin-left: auto;
}

body.detail-page .detail-nav a {
  display: inline-block;
  color: #111;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition:
    transform .25s ease,
    font-weight .25s ease;
}

body.detail-page .detail-nav a:hover {
  transform: translateY(-3px);
  font-weight: 800;
}

/* =========================================
   HERO TITLE
========================================= */

body.detail-page .detail-hero {
  background: transparent;
  color: #111;
  padding: 30px 0 18px;
}

body.detail-page .detail-hero .detail-container {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 24px;

  padding-bottom: 22px;
  border-bottom: 1px dashed rgba(0,0,0,.45);
}

/* FIGMA PROJECT. */
body.detail-page .detail-hero h1 {
  margin: 0;
  padding: 0;
  width: auto;

  font-family: "SUIT Variable", "SUIT", Arial, sans-serif;
  font-size: clamp(36px, 4.2vw, 60px);
  font-weight: 800;
  letter-spacing: -.045em;
  line-height: 1.1;

  color: #000;
  white-space: nowrap;
}

/* 돌아가기 */
body.detail-page .detail-back {
  flex-shrink: 0;
  color: #000;
  font-size: 13px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .25s ease;
}

body.detail-page .detail-back:hover {
  transform: translateX(-4px);
}

/* =========================================
   PROJECT CONTENT
========================================= */

/* FIGMA detail: video page styling retained, horizontal info and image below */
body.detail-page .detail-content { flex:1; background:transparent; padding:20px 0 35px; }
body.detail-page .figma-info { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; border:1px solid rgba(0,0,0,.55); border-radius:8px; padding:18px 22px; background:rgba(255,255,255,.25); }
body.detail-page .figma-info .info-label { font-size:11px; font-weight:800; margin:0 0 7px; }
body.detail-page .figma-info .info-value { font-size:13px; font-weight:500; margin:0; line-height:1.55; overflow-wrap:anywhere; }
body.detail-page .figma-artwork { margin:26px 0 0; text-align:center; }
body.detail-page .figma-artwork img { display:block; width:100%; height:auto; max-width:100%; }
@media(max-width:767px) { body.detail-page .figma-info {grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;} }

body.detail-page .detail-footer {
  margin-top: auto;
  padding: 20px 15px;

  background: transparent;
  border-top: 1px solid rgba(0,0,0,.25);

  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #111;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 767px) {

  body.detail-page .detail-header-inner {
    flex-direction: column;
    justify-content: center;
    padding: 18px 0;
    gap: 15px;
  }

  body.detail-page .detail-nav {
    margin: 0;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  body.detail-page .detail-nav a {
    font-size: 13px;
  }

  body.detail-page .detail-hero {
    padding-top: 25px;
  }

  body.detail-page .detail-hero .detail-container {
    flex-wrap: wrap;
    gap: 15px;
  }

  body.detail-page .detail-hero h1 {
    font-size: clamp(30px, 7vw, 42px);
  }

  body.detail-page .detail-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  body.detail-page .detail-info {
    height: auto;
  }

  body.detail-page .detail-description {
    margin-top: 15px;
  }
}
</style>

</head>

<body class="detail-page">

  <!-- HEADER -->
  <header class="detail-header">
    <div class="detail-header-inner">

      <a href="index.html" class="detail-logo">

      </a>

      <nav class="detail-nav">
        <a href="index.html#hero">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#resume">Resume</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="index.html#contact">Contact</a>
      </nav>

    </div>
  </header>



<!-- HERO -->
<section class="detail-hero">
  <div class="detail-container">

    <h1>FIGMA PROJECT.</h1>

    <a href="index.html#portfolio" class="detail-back">
      ← BACK TO PORTFOLIO
    </a>

  </div>
</section>


<!-- PROJECT CONTENT -->
<main class="detail-content">
  <div class="detail-container">
    <section class="figma-info" aria-label="프로젝트 정보">
      <div><p class="info-label">PROJECT</p><p class="info-value">FIGMA 02 / 프로젝트명 입력</p></div>
      <div><p class="info-label">CATEGORY</p><p class="info-value">UI/UX · Graphic Design</p></div>
      <div><p class="info-label">ROLE</p><p class="info-value">담당 작업 입력</p></div>
      <div><p class="info-label">TOOLS</p><p class="info-value">Figma · Adobe Illustrator</p></div>
    </section>
    <figure class="figma-artwork"><img src="assets/img/details/branding-1.jpg" alt="FIGMA 02 프로젝트 상세 이미지" loading="eager"></figure>
  </div>
</main>

<!-- FOOTER -->
  <footer class="detail-footer">
    © 2026 BOY TEA PORTFOLIO PROJECT. ALL RIGHTS RESERVED.
  </footer>

</body>
