
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GREENIE | BOY TEA</title>

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">

  
<style>
/* =========================================
   VIDEO DETAILS — FINAL
========================================= */

:root {
  --detail-width: 1144px;
}

/* 전체 페이지 */
html {
  min-height: 100%;
  background: #f2f2f2;
}

body.detail-page {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;

  font-family: "SUIT Variable", "SUIT", Arial, sans-serif;
  color: #111;

  background-color: #f2f2f2;
  background-image:
    linear-gradient(
      rgba(255,255,255,.55),
      rgba(255,255,255,.55)
    ),
    url("assets/img/concrete_texture.png");

  background-size: auto, 960px auto;
  background-position: center top;
  background-repeat: no-repeat, repeat;
}

/* 공통 정렬 기준 */
body.detail-page .detail-container,
body.detail-page .detail-header-inner {
  width: min(
    var(--detail-width),
    calc(100% - 40px)
  );
  max-width: none;
  margin-left: auto;
  margin-right: auto;
}

/* =========================================
   HEADER
========================================= */

body.detail-page .detail-header {
  position: relative;
  width: 100%;
  background: transparent;
  border-bottom: none;
  box-shadow: none;
}

body.detail-page .detail-header::before,
body.detail-page .detail-header::after {
  content: none;
}

body.detail-page .detail-header-inner {
  min-height: 82px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

body.detail-page .detail-logo {
  color: #000;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

body.detail-page .detail-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 34px;
  margin-left: auto;
}

body.detail-page .detail-nav a {
  display: inline-block;
  color: #111;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition:
    transform .25s ease,
    font-weight .25s ease;
}

body.detail-page .detail-nav a:hover {
  transform: translateY(-3px);
  font-weight: 800;
}

/* =========================================
   HERO TITLE
========================================= */

body.detail-page .detail-hero {
  background: transparent;
  color: #111;
  padding: 30px 0 18px;
}

body.detail-page .detail-hero .detail-container {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 24px;

  padding-bottom: 22px;
  border-bottom: 1px dashed rgba(0,0,0,.45);
}

/* FIGMA PROJECT. */
body.detail-page .detail-hero h1 {
  margin: 0;
  padding: 0;
  width: auto;

  font-family: "SUIT Variable", "SUIT", Arial, sans-serif;
  font-size: clamp(36px, 4.2vw, 60px);
  font-weight: 800;
  letter-spacing: -.045em;
  line-height: 1.1;

  color: #000;
  white-space: nowrap;
}

/* 돌아가기 */
body.detail-page .detail-back {
  flex-shrink: 0;
  color: #000;
  font-size: 13px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .25s ease;
}

body.detail-page .detail-back:hover {
  transform: translateX(-4px);
}

/* =========================================
   PROJECT CONTENT
========================================= */

/* FIGMA detail: video page styling retained, horizontal info and image below */
body.detail-page .detail-content { flex:1; background:transparent; padding:20px 0 35px; }
body.detail-page .figma-info { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; border:1px solid rgba(0,0,0,.55); border-radius:8px; padding:18px 22px; background:rgba(255,255,255,.25); }
body.detail-page .figma-info .info-label { font-size:11px; font-weight:800; margin:0 0 7px; }
body.detail-page .figma-info .info-value { font-size:13px; font-weight:500; margin:0; line-height:1.55; overflow-wrap:anywhere; }
body.detail-page .figma-artwork { margin:26px 0 0; text-align:center; }
body.detail-page .figma-artwork img { display:block; width:100%; height:auto; max-width:100%; }
body.detail-page .goldenchou-artwork { padding:0; }
body.detail-page .goldenchou-artwork img { margin:0; border:0; }
@media (max-width: 1100px) { body.detail-page .detail-hero h1 { white-space:normal; } }
@media(max-width:767px) { body.detail-page .figma-info {grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;} }

body.detail-page .detail-footer {
  margin-top: auto;
  padding: 20px 15px;

  background: transparent;
  border-top: 1px solid rgba(0,0,0,.25);

  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #111;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 767px) {

  body.detail-page .detail-header-inner {
    flex-direction: column;
    justify-content: center;
    padding: 18px 0;
    gap: 15px;
  }

  body.detail-page .detail-nav {
    margin: 0;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  body.detail-page .detail-nav a {
    font-size: 13px;
  }

  body.detail-page .detail-hero {
    padding-top: 25px;
  }

  body.detail-page .detail-hero .detail-container {
    flex-wrap: wrap;
    gap: 15px;
  }

  body.detail-page .detail-hero h1 {
    font-size: clamp(30px, 7vw, 42px);
  }

  body.detail-page .detail-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  body.detail-page .detail-info {
    height: auto;
  }

  body.detail-page .detail-description {
    margin-top: 15px;
  }
}

/* DARK THEME — gallery images remain unmodified */
html {background:#090a0c;}
body.detail-page {
  color:#f3f3f3;
  background-color:#090a0c;
  background-image:linear-gradient(rgba(0,0,0,.84),rgba(0,0,0,.84)),url("assets/img/concrete_texture.png");
  background-size:auto,960px auto;
  background-position:center top;
  background-repeat:no-repeat,repeat;
}
body.detail-page .detail-logo,
body.detail-page .detail-nav a,
body.detail-page .detail-hero,
body.detail-page .detail-hero h1,
body.detail-page .detail-back,
body.detail-page .detail-footer {color:#f5f5f5;}
body.detail-page .detail-hero .detail-container {border-bottom-color:rgba(255,255,255,.38);}
body.detail-page .figma-info {border-color:rgba(255,255,255,.45);background:rgba(0,0,0,.22);}
body.detail-page .figma-info .info-label {color:#e7e7e7;}
body.detail-page .figma-info .info-value {color:#f4f4f4;}
body.detail-page .detail-footer {border-top-color:rgba(255,255,255,.22);}
.gc-controls {color:#fff;}
.gc-hint {color:#c8c8c8;}
.gc-nav {background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.65);color:#fff;}
.gc-nav:hover:not(:disabled) {background:#fff;color:#111;}
.gc-progress {background:rgba(255,255,255,.24);}
.gc-progress-fill {background:#fff;}


/* GREENIE: isolate artwork from shared gallery styling */
body.detail-page .detail-content .figma-artwork {
  display: block;
  position: relative;
  width: 100%;
  max-width: 100%;
  margin: 26px 0 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  border: 0;
  line-height: 0;
  min-height: 0;
}
body.detail-page .detail-content .figma-artwork::before,
body.detail-page .detail-content .figma-artwork::after {
  content: none !important;
  display: none !important;
}
body.detail-page .detail-content .figma-artwork > img {
  display: block !important;
  position: static !important;
  float: none !important;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  transform: none !important;
  clip-path: none !important;
  object-fit: contain !important;
  opacity: 1 !important;
  filter: none !important;
  vertical-align: top !important;
}


/* Detail pages: back to top */
body.detail-page .detail-scroll-top {
  position: fixed; right: 24px; bottom: 24px; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; padding: 0;
  border: 1px solid rgba(255,255,255,.65); border-radius: 6px;
  background: rgba(9,10,12,.94); color: #fff;
  font-size: 20px; line-height: 1; cursor: pointer;
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .25s ease, transform .25s ease, visibility .25s ease;
}
body.detail-page .detail-scroll-top.is-visible {
  opacity: 1; visibility: visible; transform: translateY(0);
}
body.detail-page .detail-scroll-top:hover {background: #fff; color: #111;}
@media (max-width: 767px) {
  body.detail-page .detail-scroll-top {right: 16px; bottom: 16px; width: 42px; height: 42px;}
}
</style>

</head>

<body class="detail-page">

  <!-- HEADER -->
  <header class="detail-header">
    <div class="detail-header-inner">

      <a href="index.html" class="detail-logo">
        BOY TEA PORTFOLIO PROJECT
      </a>

      <nav class="detail-nav">
        <a href="index.html#hero">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#resume">Resume</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="index.html#contact">Contact</a>
      </nav>

    </div>
  </header>



<!-- HERO -->
<section class="detail-hero">
  <div class="detail-container">

    <h1>CHARACTER IP PROJECT.</h1>

    <a href="index.html#portfolio" class="detail-back">
      ← BACK TO PORTFOLIO
    </a>

  </div>
</section>


<!-- PROJECT CONTENT -->
<main class="detail-content">
  <div class="detail-container">
    <section class="figma-info" aria-label="프로젝트 정보">
      <div><p class="info-label">PROJECT</p><p class="info-value">그린이</p></div>
      <div><p class="info-label">CATEGORY</p><p class="info-value">Character IP · Branding · Goods</p></div>
      <div><p class="info-label">ROLE</p><p class="info-value">개인 프로젝트</p></div>
      <div><p class="info-label">TOOLS</p><p class="info-value">Adobe Illustrator · Adobe Photoshop<br>· Blender</p></div>
    </section>
    <section class="figma-artwork" aria-label="그린이 프로젝트 상세 이미지">
      <img src="assets/img/details/231020_GREENIE_02_대지 1.jpg" alt="그린이 프로젝트 상세 이미지" loading="eager">
    </section>
  </div>
</main>

<!-- FOOTER -->
  <footer class="detail-footer">
    © 2026 BOY TEA PORTFOLIO PROJECT. ALL RIGHTS RESERVED.
  </footer>



<!-- Detail page: scroll to top -->
<button type="button" class="detail-scroll-top" id="detailScrollTop" aria-label="맨 위로 이동">▲</button>
<script>
(function () {
  const button = document.getElementById('detailScrollTop');
  if (!button) return;
  function update() {
    button.classList.toggle('is-visible', window.scrollY > 300);
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('pageshow', update);
  update();
  button.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
